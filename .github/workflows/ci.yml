name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: disposable-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP + Composer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php8.3-cli php8.3-sqlite3 php8.3-mysql php8.3-mbstring php8.3-gd composer
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: Website/vendor
          key: composer-${{ hashFiles('Website/composer.lock') }}
      - name: Install & Test
        working-directory: Website
        env:
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_PORT: '3306'
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: disposable-ci-only
        run: |
          composer install --no-interaction --prefer-dist
          find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
          for test in tests/*Test.php; do php "$test"; done
          php tests/FoundationTest.php --mysql
          php tests/KajariaImportTest.php --mysql
          python3 tests/storefront_http_test.py
          python3 tests/admin_http_test.py