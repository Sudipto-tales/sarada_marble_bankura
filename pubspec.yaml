name: maa_sarada
description: "Maa Sarada — Marble & Sanitation. Premium marble e-commerce, 3D room visualization and cost calculator."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  pdfrx: 2.6.5
  turnable_page: 1.1.0
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/videos/
    - assets/catalogs/kasamood/
    - assets/brand/
    - assets/images/rooms/
    - assets/images/categories/
    - assets/images/banners/
    - assets/images/products/
    - assets/images/inspiration/
    - assets/textures/marble/
